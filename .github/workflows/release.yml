name: Release

on:
  workflow_dispatch:
  # Before LegionForge's daily image build (10:05 UTC); a compile takes ~70 min.
  schedule:
    - cron: '15 7 * * *'
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'build/**'
      - 'REVISION'
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-26.04
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          evr="$(podman run --rm registry.fedoraproject.org/fedora:45 \
            dnf5 -q repoquery --latest-limit=1 --queryformat '%{evr}\n' noctalia | tail -1)"
          test -n "$evr"
          rev="$(tr -d '[:space:]' < REVISION)"
          [[ "$rev" =~ ^[0-9]+$ ]]
          tag="${evr}-r${rev}"
          { echo "evr=$evr"; echo "rev=$rev"; echo "tag=$tag"; } >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release \`$tag\` already exists; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build patched Noctalia
        if: steps.tag.outputs.exists != 'true'
        run: |
          set -euo pipefail
          podman build -f build/Containerfile -t localhost/noctalia-osk .
          mkdir -p out
          cid="$(podman create localhost/noctalia-osk)"
          podman cp "$cid:/out/." out/
          podman rm "$cid"
          ls -la out

      - name: Checksums
        id: sums
        if: steps.tag.outputs.exists != 'true'
        env:
          EVR: ${{ steps.tag.outputs.evr }}
        run: |
          set -euo pipefail
          cd out
          if compgen -G '*.rpm' >/dev/null; then
            echo "has_rpm=true" >> "$GITHUB_OUTPUT"
            sha256sum *.rpm > SHA256SUMS
          else
            echo "has_rpm=false" >> "$GITHUB_OUTPUT"
            echo "Fedora's noctalia $EVR already includes the lock-screen keyboard. Use Fedora's package." > upstream-has-feature.txt
            sha256sum upstream-has-feature.txt > SHA256SUMS
          fi
          cat SHA256SUMS

      - name: Attest build provenance
        if: steps.tag.outputs.exists != 'true' && steps.sums.outputs.has_rpm == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'out/*.rpm'

      - name: Publish release
        if: steps.tag.outputs.exists != 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          EVR: ${{ steps.tag.outputs.evr }}
          REV: ${{ steps.tag.outputs.rev }}
          HAS_RPM: ${{ steps.sums.outputs.has_rpm }}
        run: |
          set -euo pipefail
          {
            echo "Fedora 45 \`noctalia-$EVR\` rebuilt with the lock-screen on-screen keyboard"
            echo "([noctalia-dev/noctalia#5233](https://github.com/noctalia-dev/noctalia/pull/5233)), patch revision $REV."
            echo
            echo "**Built and tested only for [LegionForge](https://github.com/shad0wcrawl3r/LegionForge)**, which requires it. It's untested and unsupported anywhere else."
            echo
            if [[ "$HAS_RPM" == true ]]; then
              echo "Verify:"
              echo '```sh'
              echo "sha256sum -c SHA256SUMS"
              echo "gh attestation verify noctalia-*.rpm -R $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml"
              echo '```'
            else
              echo "**No RPM:** Fedora's package already includes the feature. Use it."
            fi
            echo
            echo "Built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} from \`${GITHUB_SHA}\`."
          } > notes.md
          # Releases are immutable once published, so upload into a draft first.
          gh release create "$TAG" --draft --target "$GITHUB_SHA" \
            --title "noctalia $EVR (lock-screen keyboard, r$REV)" --notes-file notes.md
          gh release upload "$TAG" out/*
          gh release edit "$TAG" --draft=false --latest
          echo "Published [\`$TAG\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$TAG)." >> "$GITHUB_STEP_SUMMARY"
